[project]
name = "aws-move-outtamyway"
version = "0.1.0"
description = "Zero-latency zsh completer for the AWS CLI"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "botocore>=1.43.123",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
