# Publishes a completer for each new AWS CLI v2 release: commits and tags it on the
# branch history and creates the GitHub release (scripts/release.py). It also publishes
# any tag on history that has no release yet, so a run that stopped halfway is finished
# by the next one.
name: release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Show what would be done; change nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get the branch history and its tags
        run: git fetch --tags origin history:history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Commit as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release.py ${{ inputs.dry-run && '--dry-run' || '' }}
